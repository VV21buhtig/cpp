<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VoxEngine (Electron skeleton)</title>
<link rel="stylesheet" href="../node_modules/monaco-editor/min/vs/editor/editor.main.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1e1e1e; color: #d4d4d4; font: 13px system-ui, sans-serif;
         display: flex; height: 100vh; overflow: hidden; }
  #side { width: 230px; background: #252526; padding: 10px; display: flex;
          flex-direction: column; gap: 8px; border-right: 1px solid #2a2a2e; }
  #side h3 { color: #888; font-size: 11px; letter-spacing: 1px; }
  #tree { flex: 1; overflow: auto; }
  #tree .ent { padding: 3px 6px; border-radius: 3px; }
  #tree .ent.sel { background: #094771; color: #fff; }
  select, button { background: #3c3c3c; color: #d4d4d4; border: 1px solid #2a2a2e;
                   padding: 4px 8px; border-radius: 2px; }
  button.on { background: #0e639c; color: #fff; }
  #main { flex: 1; display: flex; flex-direction: column; }
  #bar { padding: 8px; display: flex; gap: 8px; align-items: center;
         background: #2d2d2d; border-bottom: 1px solid #2a2a2e; }
  #fps { margin-left: auto; color: #888; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center;
           background: #111; overflow: hidden; }
  canvas { max-width: 100%; max-height: 100%; }
  #stat { padding: 4px 10px; color: #888; font-size: 12px; background: #2d2d2d;
          border-top: 1px solid #2a2a2e; }
  #shaders { border-top: 1px solid #2a2a2e; background: #252526; }
  #shbar { display: flex; gap: 8px; padding: 6px 10px; align-items: center; }
  #shlog { max-height: 90px; overflow: auto; margin: 0 10px 8px; padding: 6px 8px;
           background: #111; color: #9cdcfe; font: 12px monospace; white-space: pre-wrap; }
  #shlog.err { color: #f48771; }
  #med { height: 220px; margin: 0 10px 8px; border: 1px solid #2a2a2e; }
</style>
</head>
<body>
  <div id="side">
    <h3>HIERARCHY</h3>
    <div id="tree"></div>
    <h3>DOMAIN</h3>
    <select id="dom">
      <option value="voxel">Voxel Terrain</option>
      <option value="sdf">SDF Primitives</option>
      <option value="vector">Vector Shapes</option>
      <option value="pixel">Pixel Canvas</option>
      <option value="mesh">Mesh Soup</option>
    </select>
    <h3>BACKEND</h3>
    <select id="be">
      <option value="gl">OpenGL</option>
      <option value="vk">Vulkan</option>
      <option value="webgpu">WebGPU</option>
    </select>
  </div>
  <div id="main">
    <div id="bar">
      <button id="play">Play</button>
      <button id="shtoggle">Shaders</button>
      <span id="fps">fps -</span>
    </div>
    <div id="stage"><canvas id="cv" width="1280" height="720"></canvas></div>
    <div id="shaders" style="display:none">
      <div id="shbar">
        <select id="shsel"></select>
        <button id="shreload">Reload</button>
        <span id="shstat"></span>
      </div>
      <div id="med"></div>
      <pre id="shlog"></pre>
    </div>
    <div id="stat">boot…</div>
  </div>
<script src="../node_modules/monaco-editor/min/vs/loader.js"></script>
<script src="renderer.js"></script>
</body>
</html>
